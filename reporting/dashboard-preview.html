<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekly Retro Dashboard Preview</title>
  <link rel="stylesheet" href="/_ds/cast-iron-charlie-design-system-019de132-e506-71df-a7ae-fb03115c075e/colors_and_type.css">
  <style>
    body {
      margin: 0;
      padding: var(--space-8);
      background-color: var(--black);
      color: var(--white);
      font-family: var(--font-body);
    }
    main {
      max-width: var(--max-width);
      margin: 0 auto;
    }
    .notice {
      margin-bottom: var(--space-4);
      color: var(--brass);
      font-family: var(--font-ui);
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }
  </style>
</head>
<body>
  <main>
    <p class="notice">PREVIEW // LOCAL ICF REPORTING · FIXTURE DATA</p>
    <weekly-reporting-dashboard src="/preview-report"></weekly-reporting-dashboard>
  </main>
  <script type="module">
    const report = await fetch('/test/fixtures/valid-report.json').then(response => response.json());
    const realFetch = window.fetch.bind(window);
    window.fetch = (url, init) => url === '/preview-report'
      ? Promise.resolve(new Response(JSON.stringify({ status: 'SUCCESS', data: report }), { status: 200, headers: { 'Content-Type': 'application/json' } }))
      : realFetch(url, init);
    await import('./weekly-reporting-dashboard.mjs');
  </script>
</body>
</html>
