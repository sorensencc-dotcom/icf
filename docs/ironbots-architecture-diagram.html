<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ironbots Autonomous Bot Architecture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Barlow+Condensed:wght@400;600;700&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f2ece2;
      color: #2c2420;
      font-family: 'Barlow Condensed', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 30px 20px;
    }
    .diagram-container {
      background: #f2ece2;
      border: 2px solid #2c2420;
      border-radius: 4px;
      padding: 36px 40px;
      max-width: 1120px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(44, 36, 32, 0.08);
    }
    header {
      border-bottom: 2px solid #c4501a;
      padding-bottom: 18px;
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .title-group h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #2c2420;
      line-height: 1.1;
    }
    .title-group p {
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #5c5349;
      margin-top: 4px;
      font-weight: 600;
    }
    .badge {
      font-family: 'Geist Mono', monospace;
      font-size: 0.8rem;
      background: #2c2420;
      color: #f2ece2;
      padding: 6px 14px;
      border-radius: 2px;
      letter-spacing: 0.05em;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
    footer {
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid rgba(92, 83, 73, 0.25);
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #5c5349;
      font-family: 'Geist Mono', monospace;
    }
  </style>
</head>
<body>

<div class="diagram-container">
  <header>
    <div class="title-group">
      <h1>Ironbots Autonomous Bot Architecture</h1>
      <p>Deterministic Zero-Token Background Automation &amp; Unattended S4U Scheduler</p>
    </div>
    <div class="badge">CATEGORY: \Ironbots\</div>
  </header>

  <svg viewBox="0 0 1040 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c4501a" />
      </marker>
      <marker id="arrow-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5c5349" />
      </marker>
    </defs>

    <!-- Background Grid Bands -->
    <rect x="20" y="20" width="300" height="490" rx="4" fill="#ebe4d8" stroke="#5c5349" stroke-dasharray="3 3" />
    <text x="35" y="48" font-family="'Barlow Condensed', sans-serif" font-weight="700" font-size="16" fill="#5c5349" letter-spacing="1">1. TRIGGER &amp; SCHEDULER</text>

    <rect x="340" y="20" width="360" height="490" rx="4" fill="#ebe4d8" stroke="#5c5349" stroke-dasharray="3 3" />
    <text x="355" y="48" font-family="'Barlow Condensed', sans-serif" font-weight="700" font-size="16" fill="#5c5349" letter-spacing="1">2. AUTONOMOUS ENGINES</text>

    <rect x="720" y="20" width="300" height="490" rx="4" fill="#ebe4d8" stroke="#5c5349" stroke-dasharray="3 3" />
    <text x="735" y="48" font-family="'Barlow Condensed', sans-serif" font-weight="700" font-size="16" fill="#5c5349" letter-spacing="1">3. PERSISTENCE &amp; TELEMETRY</text>

    <!-- Node 1: Task Scheduler \Ironbots\ -->
    <rect x="40" y="80" width="260" height="100" rx="3" fill="#f2ece2" stroke="#2c2420" stroke-width="2" />
    <text x="55" y="110" font-family="'Playfair Display', serif" font-weight="700" font-size="18" fill="#2c2420">Windows Task Scheduler</text>
    <text x="55" y="132" font-family="'Geist Mono', monospace" font-size="12" fill="#c4501a">Category: \Ironbots\</text>
    <text x="55" y="152" font-family="'Barlow Condensed', sans-serif" font-size="13" fill="#5c5349">S4U Principal (Runs Unattended)</text>

    <text x="55" y="272" font-family="'Geist Mono', monospace" font-size="12" fill="#5c5349">npm run bot:all</text>
    <text x="55" y="290" font-family="'Barlow Condensed', sans-serif" font-size="13" fill="#5c5349">Interactive &amp; Dry-Run Flags</text>

    <!-- Node 3: Low-Token Agent Query -->
    <rect x="40" y="345" width="260" height="85" rx="3" fill="#f2ece2" stroke="#2c2420" stroke-width="2" />
    <text x="55" y="375" font-family="'Playfair Display', serif" font-weight="700" font-size="17" fill="#2c2420">GrokBot / Multi-Agent</text>
    <text x="55" y="397" font-family="'Geist Mono', monospace" font-size="12" fill="#5c5349">Reads JSON Summaries</text>
    <text x="55" y="415" font-family="'Barlow Condensed', sans-serif" font-size="13" fill="#c4501a">&lt; 100 Token Footprint</text>

    <!-- Node 4: KB Sentinel Bot -->
    <rect x="360" y="80" width="320" height="175" rx="3" fill="#f2ece2" stroke="#c4501a" stroke-width="2" />
    <rect x="360" y="80" width="320" height="28" fill="#c4501a" />
    <text x="375" y="100" font-family="'Barlow Condensed', sans-serif" font-weight="700" font-size="14" fill="#f2ece2" letter-spacing="1">BOT 1: KB-SENTINEL (DAILY 03:00 AM)</text>
    <text x="375" y="132" font-family="'Playfair Display', serif" font-weight="700" font-size="16" fill="#2c2420">kb-sentinel-bot.mjs</text>

    <text x="375" y="174" font-family="'Barlow Condensed', sans-serif" font-size="13" fill="#2c2420">• Detects broken wikilinks &amp; doc drift</text>
    <text x="375" y="194" font-family="'Barlow Condensed', sans-serif" font-size="13" fill="#2c2420">• Runs autoheal repair passes safely</text>
    <text x="375" y="214" font-family="'Barlow Condensed', sans-serif" font-size="13" fill="#5c5349">• Cost: 0 LLM Tokens | Speed: ~300ms</text>
    <text x="375" y="234" font-family="'Geist Mono', monospace" font-size="11" fill="#c4501a">Wrapper: schedule-task-wrapper-KB-Sentinel.ps1</text>

    <!-- Node 5: TRM Bot -->
    <rect x="360" y="280" width="320" height="195" rx="3" fill="#f2ece2" stroke="#2c2420" stroke-width="2" />
    <rect x="360" y="280" width="320" height="28" fill="#2c2420" />

    <text x="375" y="332" font-family="'Playfair Display', serif" font-weight="700" font-size="16" fill="#2c2420">trm-bot-runner.mjs</text>
    <text x="375" y="354" font-family="'Barlow Condensed', sans-serif" font-size="13" fill="#2c2420">• Evaluates kb-sync/trm-research-gaps.md</text>
    <text x="375" y="374" font-family="'Barlow Condensed', sans-serif" font-size="13" fill="#2c2420">• Matches topics via SQLite FTS5 database</text>
    <text x="375" y="394" font-family="'Barlow Condensed', sans-serif" font-size="13" fill="#2c2420">• Synthesizes RFC decision notes in wiki/research/</text>
    <text x="375" y="414" font-family="'Barlow Condensed', sans-serif" font-size="13" fill="#2c2420">• Appends SHA-256 ledger entries to wiki/Log.md</text>
    <text x="375" y="434" font-family="'Barlow Condensed', sans-serif" font-size="13" fill="#5c5349">• Cost: 0 Tokens for Index / Low for Drafts</text>
    <text x="375" y="454" font-family="'Geist Mono', monospace" font-size="11" fill="#c4501a">Wrapper: schedule-task-wrapper-TRM-Bot.ps1</text>

    <!-- Node 6: Telemetry Feeds -->
    <rect x="740" y="80" width="260" height="110" rx="3" fill="#f2ece2" stroke="#2c2420" stroke-width="2" />
    <text x="755" y="110" font-family="'Playfair Display', serif" font-weight="700" font-size="17" fill="#2c2420">Status Feed Telemetry</text>
    <text x="755" y="132" font-family="'Geist Mono', monospace" font-size="11" fill="#c4501a">_status-feed/kb_sentinel_report.json</text>
    <text x="755" y="152" font-family="'Geist Mono', monospace" font-size="11" fill="#c4501a">_status-feed/trm_bot_report.json</text>
    <text x="755" y="172" font-family="'Barlow Condensed', sans-serif" font-size="13" fill="#5c5349">Health score, counts, elapsed time</text>

    <!-- Node 7: Knowledge Base & RFC Artifacts -->
    <rect x="740" y="215" width="260" height="110" rx="3" fill="#f2ece2" stroke="#2c2420" stroke-width="2" />
    <text x="755" y="245" font-family="'Playfair Display', serif" font-weight="700" font-size="17" fill="#2c2420">Wiki Entities &amp; Notes</text>
    <text x="755" y="267" font-family="'Geist Mono', monospace" font-size="11" fill="#5c5349">wiki/research/rfc-gap-*.md</text>
    <text x="755" y="287" font-family="'Geist Mono', monospace" font-size="11" fill="#5c5349">wiki/Log.md (Audit Trail)</text>
    <text x="755" y="307" font-family="'Barlow Condensed', sans-serif" font-size="13" fill="#5c5349">Obsidian Vault &amp; Remote Sync</text>

    <!-- Node 8: Iron Command Forge Integration -->
    <rect x="740" y="350" width="260" height="110" rx="3" fill="#f2ece2" stroke="#c4501a" stroke-width="2" />
    <text x="755" y="380" font-family="'Playfair Display', serif" font-weight="700" font-size="17" fill="#2c2420">Iron Command Forge</text>
    <text x="755" y="402" font-family="'Geist Mono', monospace" font-size="11" fill="#c4501a">icf/reporting/snapshot-store</text>
    <text x="755" y="422" font-family="'Barlow Condensed', sans-serif" font-size="13" fill="#2c2420">Aggregated Health Dashboard</text>
    <text x="755" y="442" font-family="'Barlow Condensed', sans-serif" font-size="13" fill="#5c5349">Real-time status &amp; alert metrics</text>

    <!-- Connectors -->
    <!-- Task Scheduler to KB Sentinel -->
    <path d="M 300 130 L 350 130" fill="none" stroke="#c4501a" stroke-width="2" marker-end="url(#arrow)" />
    <!-- Task Scheduler to TRM Bot -->
    <path d="M 300 150 L 330 150 L 330 330 L 350 330" fill="none" stroke="#2c2420" stroke-width="2" marker-end="url(#arrow)" />
    <!-- CLI to Both Bots -->
    <path d="M 300 260 L 330 260 L 330 200 L 350 200" fill="none" stroke="#5c5349" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrow-muted)" />
    <path d="M 300 260 L 330 260 L 330 360 L 350 360" fill="none" stroke="#5c5349" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrow-muted)" />

    <!-- KB Sentinel to Telemetry -->
    <path d="M 680 130 L 730 130" fill="none" stroke="#c4501a" stroke-width="2" marker-end="url(#arrow)" />
    <!-- TRM Bot to Telemetry -->
    <path d="M 680 340 L 710 340 L 710 160 L 730 160" fill="none" stroke="#2c2420" stroke-width="2" marker-end="url(#arrow)" />

    <!-- TRM Bot to Wiki Artifacts -->
    <path d="M 680 370 L 710 370 L 710 270 L 730 270" fill="none" stroke="#2c2420" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Telemetry to ICF -->
    <path d="M 870 190 L 870 340" fill="none" stroke="#c4501a" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow)" />

    <!-- Telemetry to Agent Query -->
    <path d="M 740 140 L 720 140 L 720 470 L 170 470 L 170 435" fill="none" stroke="#5c5349" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrow-muted)" />
  </svg>

  <footer>
    <span>DESIGN STANDARD: CATHRYN LAVERY (WARM PALETTE)</span>
    <span>TOOLFORGE / CIC AUTONOMOUS BOT PIPELINE</span>
  </footer>
</div>

</body>
</html>
